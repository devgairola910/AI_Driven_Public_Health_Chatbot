<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Community health signal map</title>
  <desc id="desc">Abstract map with public health signal points and awareness routes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f7f1"/>
      <stop offset="0.55" stop-color="#edf3ff"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#28505f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="900" height="420" rx="28" fill="url(#sky)"/>
  <path d="M54 262 C150 168 247 302 348 211 C442 127 553 154 644 210 C737 267 798 219 854 154" fill="none" stroke="#2f9b8f" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M74 323 C163 243 246 346 346 285 C464 212 578 324 676 269 C748 229 795 255 841 289" fill="none" stroke="#5577d9" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <g fill="#ffffff" stroke="#c7d8e8" stroke-width="2" filter="url(#shadow)">
    <rect x="92" y="84" width="184" height="96" rx="20"/>
    <rect x="360" y="68" width="192" height="112" rx="20"/>
    <rect x="618" y="86" width="188" height="100" rx="20"/>
    <rect x="171" y="237" width="206" height="98" rx="20"/>
    <rect x="508" y="245" width="216" height="96" rx="20"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#18323a">
    <text x="124" y="124" font-size="22">Fever</text>
    <text x="124" y="152" font-size="15" fill="#536b74">early care prompts</text>
    <text x="394" y="112" font-size="22">Mosquito</text>
    <text x="394" y="142" font-size="15" fill="#536b74">prevention alerts</text>
    <text x="652" y="126" font-size="22">Cough</text>
    <text x="652" y="154" font-size="15" fill="#536b74">respiratory guidance</text>
    <text x="205" y="279" font-size="22">Water</text>
    <text x="205" y="307" font-size="15" fill="#536b74">safe hygiene tips</text>
    <text x="543" y="287" font-size="22">Heat</text>
    <text x="543" y="315" font-size="15" fill="#536b74">urgent signs watched</text>
  </g>
  <g>
    <circle cx="310" cy="197" r="13" fill="#e14d47"/>
    <circle cx="310" cy="197" r="24" fill="#e14d47" opacity="0.16"/>
    <circle cx="590" cy="210" r="13" fill="#e7a53b"/>
    <circle cx="590" cy="210" r="24" fill="#e7a53b" opacity="0.18"/>
    <circle cx="748" cy="231" r="13" fill="#2f9b8f"/>
    <circle cx="748" cy="231" r="24" fill="#2f9b8f" opacity="0.18"/>
  </g>
</svg>
